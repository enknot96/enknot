name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  schedule:
    # UTC 21:17 = JST 6:17。外部ブログ(note/Zenn/dev.to)の記事一覧はビルド時に取り込まれるため、
    # 日次でビルドし直すことで /blog を更新する。
    # 毎時0分付近はGitHub Actionsが混雑して遅延しやすいので、意図的にずらしている。
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

# push と日次cronが同時に走ってデプロイが競合しないようにする。
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ブログ一覧は fetch の結果がビルド時にHTMLへ焼き込まれる。
      # 取得に失敗した場合は src/lib/blog.ts が例外を投げてこのステップが失敗し、
      # デプロイされないため、公開中のサイトは前回の内容のまま維持される。
      #
      # 【重要】.next/cache を actions/cache 等で復元してはいけない。
      # Next.js はビルド時 fetch の結果を .next/cache/fetch-cache に保存するため、
      # これを復元すると古い記事一覧が再利用され、日次ビルドしても /blog が更新されなくなる。
      - name: Build static site
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
